[project]
name = "gef-ai-data-quality-bus"
version = "0.1.0"
description = "AI-powered data quality and schema reconciliation for GEF pipeline"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langgraph>=0.3",
    "chromadb>=0.5",
    "sentence-transformers>=3.0,<4.0",
    "transformers>=4.0,<5.0",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
dqbus = "src.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: marks tests that call external APIs"]

[tool.ruff]
target-version = "py311"
line-length = 120

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
